# Spring
spring.application.name=medical-clinic-proxy
server.port=8083

# Swagger
springdoc.api-docs.path=/api-docs

# Database
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;
spring.datasource.username=sa
spring.datasource.password=password
# H2
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Logger
logging.level.root=INFO
logging.level.neqrofukk.medical-clinic-proxy.demo=DEBUG
logging.level.liquibase=DEBUG

# ProblemDetails
spring.mvc.problemdetails.enabled=true

# Feign
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true